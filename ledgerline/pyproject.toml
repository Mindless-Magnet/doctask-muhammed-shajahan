[project]
name = "ledgerline"
version = "0.1.0"
description = "Agentic vendor document file reconciliation with grounded citations and human gating"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-aws>=0.2.7",
    "langchain-core>=0.3.20",
    "boto3>=1.35",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.17",
    "mcp>=1.1",  # 1.x and 2.x both supported, see mcp/server.py
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "reportlab>=4.2",
]

[project.scripts]
ledgerline = "ledgerline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerline"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# typer and fastapi both express parameters as call-valued defaults; that is their documented API,
# not an accident, so the rule is off for the two modules that define command signatures.
per-file-ignores = {"src/ledgerline/cli.py" = ["B008"], "src/ledgerline/api/app.py" = ["B008"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "live: requires real Bedrock credentials, excluded from the default run",
]
addopts = "-m 'not live'"
